name: Build Hare APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'zulu', java-version: '21' }
      - name: Setup Project
        run: |
          mkdir app && cd app
          npm init -y
          mkdir www && echo "Hare" > www/index.html
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Hare" "tr.com.ilmilutuf.hare" --web-dir www
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "tr.com.ilmilutuf.hare",
            "appName": "Hare",
            "webDir": "www",
            "server": { "url": "https://hare.ilmilutuf.com.tr", "cleartext": true }
          }
          EOF
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: cd app/android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Hare-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
